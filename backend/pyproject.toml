[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-studio-backend"
version = "0.1.0"
description = "Local API for Vision Studio"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "platformdirs>=4,<5",
    "pillow==12.3.0",
    "opencv-python==5.0.0.93",
    "lap==0.5.13",
    "torch>=2.14,<2.15",
    "torchvision>=0.29,<0.30",
    "ultralytics==8.4.153",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
