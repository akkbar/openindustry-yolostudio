[package]
name = "vision-studio"
version = "0.1.0"
description = "Industrial computer vision desktop studio"
edition = "2021"
rust-version = "1.98"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
